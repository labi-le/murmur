# typos allow-list for murmur.
#
# Every entry below is a word this workspace spells the way it does on purpose:
# a wire-format field name, an identifier a peer or an existing configuration
# key depends on, or a system API field (libc's msghdr, a platform constant).
# Renaming one would change something a peer reads or break a name a caller
# relies on, so `typos` is told to leave them alone.
#
# Notable cases: `contianer` is a real filename inside the anytls skiplist
# module; `COMMOND` is a UDP-forwarder identifier kept verbatim; `invaild` is a
# misspelling that is part of an existing configuration key; `controllen` is the
# msghdr field name from libc; `OIF` is the netlink attribute name (`RTA_OIF`),
# and `Initation` appears inside `HandshakeInitationRate`, the constant as
# wireguard-go spells it upstream.

[default]
extend-ignore-identifiers-re = []

[default.extend-words]
ANE = "ANE"
BA = "BA"
Ba = "Ba"
COMMOND = "COMMOND"
Ciph = "Ciph"
Encrypter = "Encrypter"
