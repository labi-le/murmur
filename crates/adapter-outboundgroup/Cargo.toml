[package]
name = "murmur-adapter-outboundgroup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
fancy-regex.workspace = true
parking_lot.workspace = true
psl.workspace = true
serde.workspace = true
serde_json.workspace = true
yaml_serde.workspace = true
tokio.workspace = true
tokio-util.workspace = true
murmur-adapter-outbound = { path = "../adapter-outbound", default-features = false }
murmur-adapter-provider = { path = "../adapter-provider", default-features = false }
murmur-common = { path = "../common" }
murmur-common-callback = { path = "../common-callback" }
murmur-constant = { path = "../constant" }
murmur-log = { path = "../log" }


[features]
extra-protocols = ["murmur-adapter-outbound/extra-protocols", "murmur-adapter-provider/extra-protocols"]
default = ["extra-protocols", "easytier", "tailscale", "zerotier"]
easytier = ["murmur-adapter-outbound/easytier", "murmur-adapter-provider/easytier"]
tailscale = ["murmur-adapter-outbound/tailscale", "murmur-adapter-provider/tailscale"]
zerotier = ["murmur-adapter-outbound/zerotier", "murmur-adapter-provider/zerotier"]

[dev-dependencies]
murmur-adapter = { path = "../adapter", default-features = false }

[lints]
workspace = true
