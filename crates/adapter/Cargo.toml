[package]
name = "murmur-adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
murmur-constant-features = { path = "../constant-features" }
murmur-log = { path = "../log" }
anyhow.workspace = true
async-trait.workspace = true
bytes.workspace = true
chrono.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
serde.workspace = true
serde_json.workspace = true
yaml_serde.workspace = true
tokio.workspace = true
tokio-util.workspace = true
url.workspace = true
murmur-adapter-outbound = { path = "../adapter-outbound", default-features = false }
murmur-common = { path = "../common" }
murmur-common-net = { path = "../common-net" }
murmur-component = { path = "../component" }
murmur-component-ca = { path = "../component-ca" }
murmur-component-tls = { path = "../component-tls" }
murmur-constant = { path = "../constant" }

[features]
extra-protocols = ["murmur-adapter-outbound/extra-protocols"]
default = ["extra-protocols", "easytier", "tailscale", "zerotier"]
easytier = ["murmur-adapter-outbound/easytier"]
tailscale = ["murmur-adapter-outbound/tailscale"]
zerotier = ["murmur-adapter-outbound/zerotier"]
no_easytier = []
no_tailscale = []
no_zerotier = []
with_gvisor = ["murmur-constant-features/with_gvisor"]
[package.metadata.cargo-machete]
ignored = ["murmur-constant-features"]

[lints]
workspace = true
