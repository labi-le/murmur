x25519-dalek.workspace = true
# The default feature set includes `cache`, which pulls `wasmtime-cache` -> zstd 0.13.
# Easytier never configures wasmtime's on-disk cache, so the feature is disabled to keep the
# advisory-affected zstd 0.13 out of the build. Every other default feature stays enabled.
wasmtime = { version = "49.0.4", default-features = false, features = [
    "anyhow", "async", "backtrace", "gc", "gc-copying", "gc-drc", "gc-null", "wat",
    "profiling", "parallel-compilation", "cranelift", "pooling-allocator", "demangle",
    "addr2line", "coredump", "debug-builtins", "runtime", "component-model",
    "component-model-async", "threads", "stack-switching", "std", "debug",
    "compile-time-builtins", "wit-parser",
] }
wasmtime-wasi = "49.0.4"
murmur-common-net = { path = "../common-net" }
murmur-component-easytier = { path = "../component-easytier" }
murmur-std-compat = { path = "../std-compat" }

[dev-dependencies]
hickory-proto.workspace = true
murmur-component = { path = "../component" }
murmur-constant = { path = "../constant" }

[lints]
workspace = true
