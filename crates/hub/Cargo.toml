[package]
name = "murmur-hub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
futures.workspace = true
hickory-proto.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
ipnet.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
murmur-adapter = { path = "../adapter" }
murmur-adapter-inbound = { path = "../adapter-inbound" }
murmur-adapter-outboundgroup = { path = "../adapter-outboundgroup" }
murmur-common = { path = "../common" }
murmur-common-convert = { path = "../common-convert" }
murmur-common-net = { path = "../common-net" }
murmur-component = { path = "../component" }
murmur-component-ca = { path = "../component-ca" }
murmur-component-ech = { path = "../component-ech" }
murmur-component-geodata = { path = "../component-geodata" }
murmur-component-http = { path = "../component-http" }
murmur-component-process = { path = "../component-process" }
murmur-component-profile = { path = "../component-profile" }
murmur-component-resource = { path = "../component-resource" }
murmur-component-sniffer = { path = "../component-sniffer" }
murmur-component-tls = { path = "../component-tls" }
murmur-component-trie = { path = "../component-trie" }
murmur-component-updater = { path = "../component-updater" }
murmur-config = { path = "../config" }
murmur-constant = { path = "../constant" }
murmur-dns = { path = "../dns" }
murmur-std-compat = { path = "../std-compat" }
murmur-listener = { path = "../listener" }
murmur-listener-config = { path = "../listener-config" }
murmur-listener-inner = { path = "../listener-inner" }
murmur-listener-tproxy = { path = "../listener-tproxy" }
murmur-log = { path = "../log" }
murmur-ntp = { path = "../ntp" }
murmur-tunnel = { path = "../tunnel" }

# `/debug/pprof` needs a CPU sampler and a symbolizer the Rust std does not ship. The crate is
# SIGPROF-based but only builds where `nix`/`findshlibs` do, so the profiling endpoints are
# Unix-only; `pprof.rs` refuses them honestly elsewhere.
[target.'cfg(unix)'.dependencies]
backtrace = "0.3.76"
flate2.workspace = true
pprof = "0.15.0"
prost.workspace = true

[features]
cmfa = ["murmur-constant/cmfa", "murmur-dns/cmfa"]
no_easytier = ["murmur-adapter/no_easytier"]
no_tailscale = ["murmur-adapter/no_tailscale"]
with_gvisor = ["murmur-adapter/with_gvisor"]
[dev-dependencies]
murmur-adapter-outbound = { path = "../adapter-outbound" }

[lints]
workspace = true
