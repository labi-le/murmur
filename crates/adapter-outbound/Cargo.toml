base64.workspace = true
chrono.workspace = true
futures.workspace = true
geiserx_tailscale = { workspace = true, optional = true }
hickory-proto.workspace = true
hex.workspace = true
http.workspace = true
http-body-util.workspace = true
ipnet.workspace = true
p256 = { workspace = true, optional = true }
parking_lot.workspace = true
portable-atomic.workspace = true
quinn.workspace = true
rand.workspace = true
russh = { workspace = true, optional = true }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
yaml_serde.workspace = true
sha2.workspace = true
socket2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tokio-util.workspace = true
uuid.workspace = true
murmur-common = { path = "../common" }
murmur-common-convert = { path = "../common-convert" }
murmur-common-net = { path = "../common-net" }
murmur-common-pool = { path = "../common-pool" }
murmur-component = { path = "../component" }
murmur-component-ca = { path = "../component-ca" }
murmur-component-easytier = { path = "../component-easytier", optional = true }
murmur-component-ech = { path = "../component-ech" }
