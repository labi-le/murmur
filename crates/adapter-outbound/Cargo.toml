murmur-transport-vmess = { path = "../transport-vmess" }
murmur-transport-xhttp = { path = "../transport-xhttp" }


[features]
extra-protocols = ["dep:russh", "dep:p256", "dep:murmur-mieru", "dep:murmur-quic", "dep:murmur-transport-anytls", "dep:murmur-transport-hysteria", "dep:murmur-transport-hysteria2", "dep:murmur-transport-kcptun", "dep:murmur-transport-masque", "dep:murmur-transport-openvpn", "dep:murmur-transport-shadowquic", "dep:murmur-transport-simple-obfs", "dep:murmur-transport-snell", "dep:murmur-transport-ssr", "dep:murmur-transport-sudoku", "dep:murmur-transport-trusttunnel", "dep:murmur-transport-tuic"]
default = ["extra-protocols", "easytier", "tailscale", "zerotier"]
easytier = ["dep:murmur-easytier", "dep:murmur-component-easytier"]
tailscale = ["dep:geiserx_tailscale"]
zerotier = ["dep:murmur-zerotier"]

[package.metadata.cargo-machete]
ignored = ["geiserx_tailscale"]

[dev-dependencies]
murmur-testsupport-probe = { path = "../testsupport-probe" }
murmur-testsupport = { path = "../testsupport" }
smoltcp.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
x25519-dalek.workspace = true

[lints]
workspace = true
