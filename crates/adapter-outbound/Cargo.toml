murmur-transport-mkcp = { path = "../transport-mkcp" }
murmur-transport-openvpn = { path = "../transport-openvpn", optional = true }
murmur-transport-shadowquic = { path = "../transport-shadowquic", optional = true }
murmur-transport-shadowsocks = { path = "../transport-shadowsocks" }
murmur-transport-shadowtls = { path = "../transport-shadowtls" }
murmur-transport-simple-obfs = { path = "../transport-simple-obfs", optional = true }
