[workspace.package]
version = "1.19.15"
edition = "2021"
rust-version = "1.97"
license = "GPL-3.0-only"
publish = false
[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
unused_qualifications = "warn"
non_ascii_idents = "deny"
noop_method_call = "deny"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
linker_messages = "warn"
# allow: `dead_code_pub_in_binary` is documented as a *binary-crate* lint
# ("Opt in for binary crates; leave it off for library crates, where `pub` items
# are the intended API surface"). Every member of this workspace except the
# `murmur` binary is a library, and `--all-targets` compiles each library's unit
# test target as a binary, so the lint reports `pub` items that other workspace
# crates consume. Genuine dead code is still caught by rustc's `dead_code` (for
# private items) and by `unreachable_pub` above (for `pub` items that nothing
# outside the crate can reach).
dead_code_pub_in_binary = "allow"
# allow: `missing_docs` is a rustc lint reserved for crates that become
# publishable; every member of this workspace is `publish = false`, so it would
# police an API surface that has no consumers outside the tree.
missing_docs = "allow"

[workspace.lints.clippy]
# Group entries carry `priority = -1` so a per-lint override below can win
# without Cargo rejecting the manifest (RUST_GUIDELINES.md section 9).
all = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# --- section 9 "Panic Prevention": deny -------------------------------------
# A proxy core is a long-lived server: a panic on any path drops every
# connection the process is carrying, so these stay at deny and every
# production-path exception is an explicit `#[expect(..., reason = "...")]`.
unwrap_used = { level = "deny", priority = 1 }
expect_used = { level = "deny", priority = 1 }
panic = { level = "deny", priority = 1 }
todo = { level = "deny", priority = 1 }
unimplemented = { level = "deny", priority = 1 }
unreachable = { level = "warn", priority = 1 }

# --- section 9 "Defensive Programming" --------------------------------------
indexing_slicing = { level = "deny", priority = 1 }
string_slice = { level = "warn", priority = 1 }
wildcard_enum_match_arm = { level = "deny", priority = 1 }
fallible_impl_from = { level = "deny", priority = 1 }
fn_params_excessive_bools = { level = "deny", priority = 1 }
unneeded_field_pattern = { level = "warn", priority = 1 }

# --- section 9 "Async" and "RAII" -------------------------------------------
await_holding_lock = { level = "deny", priority = 1 }
await_holding_refcell_ref = { level = "deny", priority = 1 }
mem_forget = { level = "deny", priority = 1 }
future_not_send = { level = "warn", priority = 1 }

# --- section 9 "Debug Artifact Prevention" ----------------------------------
dbg_macro = { level = "deny", priority = 1 }
print_stdout = { level = "deny", priority = 1 }
print_stderr = { level = "deny", priority = 1 }

# --- section 9 "Performance" -------------------------------------------------
clone_on_ref_ptr = { level = "deny", priority = 1 }
redundant_clone = { level = "warn", priority = 1 }
implicit_clone = { level = "warn", priority = 1 }
needless_pass_by_value = { level = "warn", priority = 1 }
large_enum_variant = { level = "warn", priority = 1 }
box_collection = { level = "warn", priority = 1 }
rc_buffer = { level = "warn", priority = 1 }
large_stack_arrays = { level = "warn", priority = 1 }
large_stack_frames = { level = "warn", priority = 1 }

# --- section 9 "Numeric and Pointer Cast" -----------------------------------
# `unsafe_code = "deny"` (not `forbid`), so the pointer lints are live.
cast_lossless = { level = "warn", priority = 1 }
ptr_as_ptr = { level = "warn", priority = 1 }
cast_ptr_alignment = { level = "deny", priority = 1 }
transmute_ptr_to_ref = { level = "deny", priority = 1 }
not_unsafe_ptr_arg_deref = { level = "deny", priority = 1 }

# --- section 9 "String Handling" / "Complexity" / "must_use" ----------------
str_to_string = { level = "warn", priority = 1 }
cognitive_complexity = { level = "warn", priority = 1 }
too_many_lines = { level = "warn", priority = 1 }
must_use_candidate = { level = "warn", priority = 1 }

# --- documented allows, each with the reason section 9 demands ---------------
# allow: `doc_markdown` (pedantic) demands backticks around anything that looks
# like an identifier, and this tree documents protocols by name (VLESS, XHTTP,
# ShadowTLS, ZeroTier). The backtick churn on proper nouns degrades the docs
# rather than improving them, which is exactly the false-positive stream the
# guideline calls out; re-enable only together with a `doc-valid-idents` list.
doc_markdown = { level = "allow", priority = 1 }
# allow: `duration_suboptimal_units` (pedantic) rewrites `from_millis(5000)`
# into `from_secs(5)`. Families of related timeouts are deliberately written in
# one unit here so they can be compared by eye; rewriting them loses that.
duration_suboptimal_units = { level = "allow", priority = 1 }
# allow: `missing_const_for_fn` (nursery) is a one-way semver promise -- taking
# `const` away again is breaking -- and it has known false positives. Opting a
# function into `const` stays a deliberate per-function decision.
missing_const_for_fn = { level = "allow", priority = 1 }
# allow: `redundant_pub_crate` (nursery) directly contradicts rustc's
# `unreachable_pub = "warn"` above: one wants `pub(crate)` for crate-internal
# items, the other calls it redundant. Two lints, opposite advice; the rustc
# one wins because it is the one that affects the compiled interface.
redundant_pub_crate = { level = "allow", priority = 1 }
# allow: `option_if_let_else` (nursery) degrades readability on the multi-arm
# `if let ... else` bodies that dominate the protocol state machines here.
option_if_let_else = { level = "allow", priority = 1 }
# allow: `exhaustive_enums` / `exhaustive_structs` want `#[non_exhaustive]` on
# every public type, which then forces `_` arms in this workspace's own matches
# -- the exact pattern `wildcard_enum_match_arm = "deny"` above forbids. These
# crates are all `publish = false` internal members, so the semver hazard the
# lints defend against does not exist here.
exhaustive_enums = { level = "allow", priority = 1 }
exhaustive_structs = { level = "allow", priority = 1 }
# allow: `module_inception` fires on the `foo::foo` module shape that mirrors
# the protocol layout (`socks5::socks5`), which reads better than renaming.
module_inception = { level = "allow", priority = 1 }
# allow: `unreadable_literal` fights the wire-format tables (magic numbers,
# CRC polynomials, S-boxes) where grouping digits actively obscures the byte
# layout being transcribed.
unreadable_literal = { level = "allow", priority = 1 }
# allow: `missing_errors_doc` / `missing_panics_doc` are API-documentation
# lints for published crates; these are internal `publish = false` members.
missing_errors_doc = { level = "allow", priority = 1 }
missing_panics_doc = { level = "allow", priority = 1 }


[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.test]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

[profile.test.package."*"]
debug = false

# Keep panic recovery and the selected feature set; trade build time for size.
[profile.compact]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = "symbols"

[patch.crates-io]
rustls = { path = "vendor/rustls" }
