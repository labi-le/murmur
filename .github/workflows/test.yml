name: Test

# Runs the workspace suite against an explicit commit, tag or branch, so a revision
# that no longer sits at a branch head can still be proven.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA, tag or branch to test
        required: true

env:
  CARGO_TERM_COLOR: always
  # Denying rustc warnings through this variable keeps the build cache valid,
  # unlike RUSTFLAGS.
  CARGO_BUILD_WARNINGS: deny

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # --no-fail-fast so one crate's failure does not hide the rest of the matrix.
      - run: cargo test --workspace --no-fail-fast --locked
      # Lints every target-gated body the runner's platform compiles; the manifest's
      # workspace lints and clippy.toml set the levels.
      - run: cargo clippy --workspace --all-targets --locked --keep-going -- -D warnings

  router-features:
    name: router features (${{ matrix.feature }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        feature: [router, router-vvt]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.feature }}
      - run: cargo check -p murmur --no-default-features --features ${{ matrix.feature }} --locked
      - run: >-
          cargo test --locked --no-default-features --features murmur/${{ matrix.feature }}
          -p murmur -p murmur-adapter -p murmur-adapter-outbound
          -p murmur-adapter-outboundgroup -p murmur-adapter-provider
          -p murmur-config -p murmur-listener -p murmur-hub
          -p murmur-component-generator -p murmur-component-updater
      - run: >-
          cargo clippy --locked --all-targets --no-default-features --features murmur/${{ matrix.feature }}
          -p murmur -p murmur-adapter -p murmur-adapter-outbound
          -p murmur-adapter-outboundgroup -p murmur-adapter-provider
          -p murmur-config -p murmur-listener -p murmur-hub
          -p murmur-component-generator -p murmur-component-updater -- -D warnings
