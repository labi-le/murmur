name: Audit

# Dependency and advisory hygiene, run by hand. cargo-deny reads deny.toml, whose
# accepted exceptions carry their own justification.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA, tag or branch to audit
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always

jobs:
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: EmbarkStudios/cargo-deny-action@v2

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
