name: Codex review

# Codex reacts to an "@codex review" comment; the automatic-review toggle lives in the Codex account settings.
on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  issues: write

jobs:
  request:
    name: Request a review
    # A fork gets a read-only token and a draft gets its review at ready_for_review, so both are skipped.
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Comment "@codex review"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body '@codex review'
