name: Release VVT

# Attaches the VLESS/Trojan/VMess-only Linux musl assets (ARM64 and soft-float
# MIPS) to an existing release. It does not replace the full-build assets or
# version.txt: the updater uses version-vvt.txt for this channel.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the VVT asset to
        required: true

permissions:
  contents: write

env:
  NIX_CONFIG: experimental-features = nix-command flakes
  CACHIX_CACHE: murmur-lab

jobs:
  attach-vvt:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
      - name: Install Nix
        run: |
          curl -L https://nixos.org/nix/install | sh -s -- --daemon --yes
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          nix --version
          # Later steps are not login shells, so the installer's profile is not sourced for
          # them; cachix-action is one of those steps and needs `nix` on PATH.
          echo "$(dirname "$(command -v nix)")" >> "$GITHUB_PATH"
          # The daemon install leaves this user untrusted, so `cachix use` is refused and the
          # daemon ignores a substituter the step passes; trust it and reload the daemon.
          echo "trusted-users = root runner" | sudo tee -a /etc/nix/nix.conf >/dev/null
          sudo systemctl restart nix-daemon.service 2>/dev/null || sudo pkill nix-daemon || true
      # The action installs Cachix with `nix-env -iA`, which needs channels; install it from the
      # flake's pinned nixpkgs instead and let the action find the binary on PATH.
      - name: Install Cachix
        if: env.CACHIX_AUTH_TOKEN != ''
        run: |
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          nix profile install --no-write-lock-file --inputs-from . nixpkgs#cachix
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"

      - uses: cachix/cachix-action@v17
        if: env.CACHIX_AUTH_TOKEN != ''
        with:
          name: ${{ env.CACHIX_CACHE }}
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}
          # Pushing through the daemon's post-build hook needs a root-owned nix.conf; the
          # post-step push reads the same store through the daemon and needs no extra privilege.
          useDaemon: false
      - name: Build and package
        run: |
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          nix develop .#aarch64-musl --command bash -se <<'BUILD'
            set -euo pipefail
            cargo build --locked --profile compact -p murmur --bin murmur \
              --no-default-features --features router-vvt \
              --target aarch64-unknown-linux-musl
            version=$(awk '/^pub static VERSION: &str = /{ sub(/^[^"]*"/, ""); sub(/".*/, ""); print; exit }' crates/constant/src/version.rs)
            test -n "$version"
            mkdir -p dist
            bash packaging/openwrt/build-ipk.sh \
              target/aarch64-unknown-linux-musl/compact/murmur \
              "$version" \
              aarch64_generic \
              "dist/murmur-vvt_${version}_aarch64_generic.ipk" \
              murmur-vvt
            cp packaging/openwrt/install.sh dist/install-openwrt.sh
            chmod 0755 dist/install-openwrt.sh
            cp target/aarch64-unknown-linux-musl/compact/murmur dist/murmur-linux-arm64-vvt
            cd dist
            gzip -9 murmur-linux-arm64-vvt
            mv murmur-linux-arm64-vvt.gz "murmur-linux-arm64-vvt-${version}.gz"
            printf "%s\n" "$version" > version-vvt.txt
            test "$(gzip -lN "murmur-linux-arm64-vvt-${version}.gz" | awk "NR == 2 { print \$4 }")" = murmur-linux-arm64-vvt
          BUILD
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release upload "$TAG" \
            dist/murmur-linux-arm64-vvt-*.gz \
            dist/murmur-vvt_*.ipk \
            dist/install-openwrt.sh \
            dist/version-vvt.txt \
            --clobber

  attach-vvt-mips:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
      - name: Install Nix
        run: |
          curl -L https://nixos.org/nix/install | sh -s -- --daemon --yes
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          nix --version
          # Later steps are not login shells, so the installer's profile is not sourced for
          # them; cachix-action is one of those steps and needs `nix` on PATH.
          echo "$(dirname "$(command -v nix)")" >> "$GITHUB_PATH"
          # The daemon install leaves this user untrusted, so `cachix use` is refused and the
          # daemon ignores a substituter the step passes; trust it and reload the daemon.
          echo "trusted-users = root runner" | sudo tee -a /etc/nix/nix.conf >/dev/null
          sudo systemctl restart nix-daemon.service 2>/dev/null || sudo pkill nix-daemon || true
      # The action installs Cachix with `nix-env -iA`, which needs channels; install it from the
      # flake's pinned nixpkgs instead and let the action find the binary on PATH.
      - name: Install Cachix
        if: env.CACHIX_AUTH_TOKEN != ''
        run: |
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          nix profile install --no-write-lock-file --inputs-from . nixpkgs#cachix
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"

      - uses: cachix/cachix-action@v17
        if: env.CACHIX_AUTH_TOKEN != ''
        with:
          name: ${{ env.CACHIX_CACHE }}
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}
          # Pushing through the daemon's post-build hook needs a root-owned nix.conf; the
          # post-step push reads the same store through the daemon and needs no extra privilege.
          useDaemon: false
      - name: Build and package
        run: |
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          nix develop .#mipsel-musl --command bash -se <<'BUILD'
            set -euo pipefail
            export MURMUR_MIPS_FLOAT=softfloat
            cargo build --locked --profile compact -p murmur --bin murmur \
              --no-default-features --features router-vvt \
              --target mipsel-unknown-linux-musl
            version=$(awk '/^pub static VERSION: &str = /{ sub(/^[^"]*"/, ""); sub(/".*/, ""); print; exit }' crates/constant/src/version.rs)
            test -n "$version"
            mkdir -p dist
            bash packaging/openwrt/build-ipk.sh \
              target/mipsel-unknown-linux-musl/compact/murmur \
              "$version" \
              mipsel_24kc \
              "dist/murmur-vvt_${version}_mipsel_24kc.ipk" \
              murmur-vvt
            cp target/mipsel-unknown-linux-musl/compact/murmur dist/murmur-linux-mipsle-softfloat-vvt
            cd dist
            gzip -9 murmur-linux-mipsle-softfloat-vvt
            mv murmur-linux-mipsle-softfloat-vvt.gz "murmur-linux-mipsle-softfloat-vvt-${version}.gz"
            test "$(gzip -lN "murmur-linux-mipsle-softfloat-vvt-${version}.gz" | awk "NR == 2 { print \$4 }")" = murmur-linux-mipsle-softfloat-vvt
          BUILD
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release upload "$TAG" \
            dist/murmur-linux-mipsle-softfloat-vvt-*.gz \
            dist/murmur-vvt_*_mipsel_24kc.ipk \
            --clobber
